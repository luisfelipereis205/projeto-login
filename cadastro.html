<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <form action="/cadastro" method="post">
        
        <div class="form-container">
            <h2>Crie sua <spam>conta</spam></h2>
            <p class="descricao-form">É rápido e leva apenas alguns segundos.</p>
            <div class="campo">
                <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required>
            </div>
            <div class="campo">
                <input
                    type="email"
                    id="email"
                    name="email"
                placeholder="Digite seu melhor e-mail" required>
            </div>
            <div class="campo">
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha forte" required>
                </div>
            <div class="campo">
                <input
                    type="password"
                    id="confirmaSenha"
                    name="confirmaSenha"
                    placeholder="Digite sua senha novamente" required>
            </div>
            <button type="submit" class="btn-cadastrar" >Finalizar cadastro</button>
            <div class="links">
                <p><a href="index.html">Já possui uma conta? Entre agora.</a></p>
            </div>
        </div>

    </form>
</body>
</html>

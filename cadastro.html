<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <form action="/cadastro" method="post">
        
        <h2>Crie sua conta</h2>
        <p>É rápido e leva apenas alguns segundos.</p>

        <label for="nome">Nome Completo</label>
        <input 
        type="text" 
        id="nome" 
        name="nome" 
        placeholder="Digite seu nome completo" 
        required>

        <label for="email">E-mail</label>
        <input 
            type="email" 
            id="email"  
            name="email" 
            placeholder="Digite seu melhor e-mail" required>

        <label for="senha">Senha</label>
        <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="Crie uma senha forte" required>

        <label for="confirmaSenha">Confirme sua senha</label>
        <input 
            type="password" 
            id="confirmaSenha" 
            name="confirmaSenha"  
            placeholder="Digite sua senha novamente" required>

        <button type="submit" class="btn-cadastrar" >Finalizar cadastro</button>

        <p><a href="index.html">Já possui uma conta? Entre agora.</a></p>

    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <form action="#" method="post">
        
        <h2>Crie sua conta</h2>
        <p>É rápido e leva apenas alguns segundos.</p>

        <label for="inName">Nome Completo</label>
        <input type="text" id="inName" name="nome" placeholder="Digite seu nome completo" required>

        <label for="newEmail">E-mail</label>
        <input type="email" id="newEmail"  name="novoEmail" placeholder="Digite seu melhor e-mail" required>

        <label for="newSenha">Senha</label>
        <input type="password" id="newSenha" name="novaSenha" placeholder="Crie uma senha forte" required>

        <label for="confirma">Confirme sua senha</label>
        <input type="password" id="confirma" name="confirmaSenha"  placeholder="Digite sua senha novamente" required>

        <button class="btn-cadastrar" id="cadastrar">Finalizar cadastro</button>

        <p><a href="index.html">Já possui uma conta? Entre agora.</a></p>

    </form>
</body>
</html>
